name: Job Alert Agent

on:
  schedule:
    - cron: '17 */4 * * *'
  workflow_dispatch:

jobs:
  run-job-agent:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install gspread google-auth pandas

      # =========================
      # CREATE GOOGLE JSON FILE
      # =========================

      - name: Create Google credentials file
        run: |
          mkdir -p credentials
          echo '${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}' > credentials/service_account.json

      # =========================
      # RUN JOB AGENT
      # =========================

      - name: Run job alert agent
        run: python job_alert_agent.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      # =========================
      # SYNC GOOGLE SHEETS
      # =========================

      - name: Sync CSV to Google Sheets
        run: python sync_to_sheets.py

      # =========================
      # COMMIT UPDATED CSV FILES
      # =========================

      - name: Commit and push updated CSV files
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"

          git add job_database.csv
          git commit -m "Update job database" || echo "No changes to commit"

          git push
